name = "qnh-shelf-life-api"
main = "worker.mjs"
compatibility_date = "2026-10-15"
workers_dev = true
preview_urls = false
# Preserve administrator-managed runtime App IDs during GitHub-triggered builds.
keep_vars = true

[vars]
ALLOWED_ORIGIN = "https://wzz79229.github.io"
MEMBER_AUTH_MODE = "qnh"

# Optional same-origin PWA hosting avoids mobile third-party-cookie restrictions.
# The deployed bundle includes imported ../dist/core.mjs and ../dist/github.mjs.
[assets]
directory = "../dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# GITHUB_APP_ID, GITHUB_APP_INSTALLATION_ID, GITHUB_APP_PRIVATE_KEY are runtime
# settings. QNH_CONNECTOR_KEY is only for the local bridge. Never put values here.
# QNH phone-session verification is not connected yet. Keep qnh mode closed until
# this phone's live product access and intended tenant are verified by the server.
