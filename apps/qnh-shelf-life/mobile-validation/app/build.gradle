plugins { id 'com.android.application' }

android {
    namespace 'com.xianqi.phonevalidation'
    compileSdk 35
    defaultConfig {
        applicationId 'com.xianqi.phonevalidation'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '0.5.0'
        testInstrumentationRunner 'com.xianqi.phonevalidation.LabelInstrumentation'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }
    buildTypes {
        debug { debuggable true }
        release { minifyEnabled true; shrinkResources true; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt') }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError true; checkReleaseBuilds true }
    // Keep paused shelf-life sources and encrypted phone data for a future release.
    sourceSets { main { java { exclude '**/MainActivity.java', '**/CaptureActivity.java', '**/CloudClient.java', '**/DraftStore.java', '**/InventoryLookupActivity.java' }; assets { exclude 'qnh-phone.js', 'batch.js' } } }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation 'com.google.zxing:core:3.5.3'
    testImplementation 'junit:junit:4.13.2'
}
