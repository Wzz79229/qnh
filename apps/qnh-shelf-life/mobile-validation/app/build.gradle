plugins { id 'com.android.application' }

android {
    namespace 'com.xianqi.phonevalidation'
    compileSdk 35
    defaultConfig {
        applicationId 'com.xianqi.phonevalidation'
        minSdk 26
        targetSdk 35
        versionCode 17
        versionName '0.8.6'
        resourceConfigurations += ['en', 'en-rCA', 'en-rGB', 'en-rIN', 'en-rAU', 'zh-rCN', 'zh-rTW', 'zh-rHK']
        testInstrumentationRunner 'com.xianqi.phonevalidation.LabelInstrumentation'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }
    buildTypes {
        debug { debuggable true }
        release { minifyEnabled true; shrinkResources true; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError true; checkReleaseBuilds true }
    // Keep paused shelf-life sources and encrypted phone data for a future release.
    sourceSets { main { java { exclude '**/MainActivity.java', '**/CaptureActivity.java', '**/CloudClient.java', '**/DraftStore.java', '**/InventoryLookupActivity.java' }; assets.srcDirs=['src/main/active-assets'] } }
}

dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'androidx.camera:camera-camera2:1.4.2'
    implementation 'androidx.camera:camera-lifecycle:1.4.2'
    implementation 'androidx.camera:camera-view:1.4.2'
    testImplementation 'junit:junit:4.13.2'
}
