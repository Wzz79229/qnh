<!doctype html><html><head><meta charset="utf-8"><style>body{font:16px sans-serif;min-width:1100px;background:#ff00ff}input{width:140px;height:24px}td{padding:12px}.top-nav-base{height:50px}.wms-wand-goods-info-rest-info-non-tooltip{display:block}</style></head><body>
<div class="saas-platform-layout-wrapper"><nav class="top-nav-base"><span class="SearchLeftName--fixture">合成测试企业</span><span class="SearchLeftTenantId--fixture">（租户ID: 777）</span><a class="TopNavSearchRightTenant--fixture"><span>合成操作员</span></a></nav><main class="saas-platform-layout-main"></main></div>
<script>
const main=document.querySelector('main'),header=document.querySelector('.SearchLeftTenantId--fixture');
const products=[
{name:'合成测试饮用水',spec:'500ml/瓶',sku:'2110000000000123456',loc:'A64-6-4'},
{name:'合成测试饮用水',spec:'1L/瓶',sku:'2110000000000123457',loc:'A65-1-2'},
{name:'区域样品二',spec:'1份',sku:'2110000000000123459',loc:'A10-2-1'},
{name:'区域样品一',spec:'1份',sku:'2110000000000123458',loc:'A10-1-2'},
{name:'【规格可选】示例泡沫地垫 厚1cm 儿童爬行垫 加厚拼接地板垫 1片/份',spec:'白色30×30cm',sku:'2110000000000198822',loc:'A10-1-1'},
{name:'不得混入的A100样品',spec:'1份',sku:'2110000000000123460',loc:'A100-1-1'}];
const legacy=()=>location.hash.startsWith('#/co-wms/non-erp/stock-query');
const fields={name:'skuNameKeyword',sku:'skuIdListStr',barcode:'upcKeyword',external:'externalGoodsCodeKeyword'};
function rows(list){return list.length?list.map(p=>'<tr><td><div class="wms-wand-goods-info"><span class="wms-wand-goods-info-goods-name-text">'+p.name+'</span><div>规格：'+p.spec+'</div></div></td><td>合成测试仓(12345)</td><td>'+(legacy()?'<span>'+p.loc+'</span><span>A100-9-9</span>':p.loc)+'</td><td><a href="#" data-sku="'+p.sku+'">查询流水</a></td></tr>').join(''):'<tr class="wms-ant-table-placeholder"><td><div class="wms-ant-empty">暂无数据</div></td></tr>';}
function filter(q){const segments=q.getAll('locationCodeSegmentList');if(segments[0]==='A10'&&!segments[1]&&!legacy())return [];return products.filter(p=>(!q.get(fields.sku)||q.get(fields.sku)===p.sku)&&(!q.get(fields.name)||p.name.includes(q.get(fields.name)))&&segments.every((part,i)=>!part||p.loc.split('-')[i]===part));}
function page(q){const list=filter(q),size=q.getAll('locationCodeSegmentList')[0]==='A10'&&!q.getAll('locationCodeSegmentList')[1]?2:100,current=Number(q.get('current')||1);return {list:list.slice((current-1)*size,current*size),previous:current>1,next:current*size<list.length};}
function update(q,delay){const data=page(q);const apply=()=>{document.querySelector('tbody').innerHTML=rows(data.list);document.getElementById('prev').disabled=!data.previous;document.getElementById('next').disabled=!data.next;wireRows();};if(delay)setTimeout(apply,100);else apply();}
function transition(q){(window.__fixtureQueries ||= []).push(Object.fromEntries(q));if(window.__fixtureExpectLocation&&!q.getAll('locationCodeSegmentList')[0])throw Error('UNFILTERED_QUERY');history.replaceState(null,'',(legacy()?'#/co-wms/non-erp/stock-query':'#/co-wms/inventory-query-integration/list')+'?'+q);header.style.display='none';setTimeout(()=>header.style.display='',800);if(legacy()&&sessionStorage.getItem('fixtureStockMode')==='true'){const xhr=new XMLHttpRequest(),body={repositoryId:12345,repositoryType:3,repositoryIds:[12345],page:Number(q.get('current')||1),pageSize:2,locationTypeStrategyId:'EMPOWER',locationCodeSegmentList:q.getAll('locationCodeSegmentList')};for(const id of Object.values(fields))body[id]=q.get(id)||'';xhr.open('POST','/api/v1/comprehensive/stock/querystock');xhr.setRequestHeader('Content-Type','application/json');xhr.send(JSON.stringify(body));}update(q,true);}
function renderInventory(){const q=new URLSearchParams(location.hash.split('?')[1]||'');if(!q.has('repositoryList')){q.set('repositoryList','[[3,12345]]');history.replaceState(null,'',location.hash.split('?')[0]+'?'+q);}main.innerHTML='<section id="fixture-panel-'+(legacy()?'list':'goodsBatch')+'">'+Object.values(fields).map(id=>'<input id="'+id+'">').join('')+'<div class="wms-wand-storage-location-input-select">'+[0,1,2,3].map(()=>'<input>').join('')+'</div><button id="find">查询</button><div class="wms-roo-picker-value-list">合成测试仓</div><table><thead><tr><th>商品信息</th><th>门店/仓</th><th>库位</th><th>操作</th></tr></thead><tbody></tbody></table><span class="wms-ant-pagination-prev"><button id="prev">上页</button></span><span class="wms-ant-pagination-next"><button id="next">下页</button></span></section>';
for(const [key,id]of Object.entries(fields))document.getElementById(id).value=q.get(id)||'';document.querySelectorAll('.wms-wand-storage-location-input-select input').forEach((e,i)=>e.value=q.getAll('locationCodeSegmentList')[i]||'');
document.getElementById('find').onclick=()=>{const next=new URLSearchParams({tab:legacy()?'list':'goodsBatch',_t:String(Date.now()),current:'1',repositoryList:'[[3,12345]]',pageSize:'2'});for(const id of Object.values(fields)){const value=document.getElementById(id).value;if(value)next.set(id,value);}for(const e of document.querySelectorAll('.wms-wand-storage-location-input-select input'))next.append('locationCodeSegmentList',e.value);transition(next);};
for(const [id,delta]of [['prev',-1],['next',1]])document.getElementById(id).onclick=()=>{const next=new URLSearchParams(location.hash.split('?')[1]);next.set('current',String(Number(next.get('current'))+delta));transition(next);};update(q,false);}
function wireRows(){document.querySelectorAll('a[data-sku]').forEach(a=>a.onclick=e=>{e.preventDefault();const url='#/co-wms/non-erp/goods-flow/list?skuIdKeyword='+a.dataset.sku+'&repositoryId=12345&repositoryType=3';if(legacy()){sessionStorage.setItem('fixtureFlowOpens',String(Number(sessionStorage.getItem('fixtureFlowOpens')||0)+1));window.open(url);return;}history.pushState(null,'',url);renderFlow();});}
function renderFlow(){sessionStorage.setItem('fixtureFlowVisits',String(Number(sessionStorage.getItem('fixtureFlowVisits')||0)+1));const q=new URLSearchParams(location.hash.split('?')[1]||''),p=products.find(p=>p.sku===q.get('skuIdKeyword'));header.style.display='none';requestAnimationFrame(()=>{main.innerHTML='<div class="wms-wand-goods-info"><span class="wms-wand-goods-info-goods-name-text">'+p.name+'</span><span class="wms-wand-goods-info-rest-info-non-tooltip">SKU：'+p.sku+'</span></div>';setTimeout(()=>requestAnimationFrame(()=>header.style.display=''),1000);});}
for(const event of ['popstate','hashchange'])addEventListener(event,()=>{if(!window.__fixtureHoldRestore&&(location.hash.includes('/inventory-query-integration/')||legacy()))renderInventory();});renderInventory();
</script></body></html>
