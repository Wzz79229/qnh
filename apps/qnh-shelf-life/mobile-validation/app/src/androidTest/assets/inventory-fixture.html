<!doctype html><html><head><meta charset="utf-8"><style>body{font:16px sans-serif;min-width:1100px;background:#ff00ff}input{width:140px;height:24px}td{padding:12px}.top-nav-base{height:50px}.wms-wand-goods-info-rest-info-non-tooltip{display:block}</style></head><body>
<div class="saas-platform-layout-wrapper"><nav class="top-nav-base"><span class="SearchLeftTenantId--fixture">（租户ID: 777）</span></nav><main class="saas-platform-layout-main"></main></div>
<script>
const main=document.querySelector('main'),header=document.querySelector('.SearchLeftTenantId--fixture');
const products=[{name:'合成测试饮用水',spec:'500ml/瓶',sku:'2110000000000123456',loc:'A64-6-4'},{name:'合成测试饮用水',spec:'1L/瓶',sku:'2110000000000123457',loc:'A65-1-2'},{name:'【规格可选】示例泡沫地垫 厚1cm 儿童爬行垫 加厚拼接地板垫 1片/份',spec:'白色30×30cm',sku:'2110000000000198822',loc:'A10-1-1'}];
const fields={name:'skuNameKeyword',sku:'skuIdListStr',barcode:'upcKeyword',external:'externalGoodsCodeKeyword'};
function rows(list){return list.length?list.map((p,i)=>'<tr><td><div class="wms-wand-goods-info"><span class="wms-wand-goods-info-goods-name-text">'+p.name+'</span><div>规格：'+p.spec+'</div></div></td><td>合成测试仓(12345)</td><td>'+p.loc+'</td><td><a href="#" data-sku="'+p.sku+'">查询流水</a></td></tr>').join(''):'<tr class="wms-ant-table-placeholder"><td><div class="wms-ant-empty">暂无数据</div></td></tr>';}
function filter(q){return products.filter(p=>(!q.get(fields.sku)||q.get(fields.sku)===p.sku)&&(!q.get(fields.name)||p.name.includes(q.get(fields.name)))&&(!q.getAll('locationCodeSegmentList')[0]||p.loc.startsWith(q.getAll('locationCodeSegmentList').filter(Boolean).join('-'))));}
function renderInventory(){const q=new URLSearchParams(location.hash.split('?')[1]||'');main.innerHTML='<section id="fixture-panel-goodsBatch">'+Object.values(fields).map(id=>'<input id="'+id+'">').join('')+'<div class="wms-wand-storage-location-input-select">'+[0,1,2,3].map(()=>'<input>').join('')+'</div><button id="find">查询</button><div class="wms-roo-picker-value-list">合成测试仓</div><table><thead><tr><th>商品信息</th><th>门店/仓</th><th>库位</th><th>操作</th></tr></thead><tbody>'+rows(filter(q))+'</tbody></table><span class="wms-ant-pagination-prev"><button disabled>上页</button></span><span class="wms-ant-pagination-next"><button disabled>下页</button></span></section>';
for(const [key,id]of Object.entries(fields))document.getElementById(id).value=q.get(id)||'';document.querySelectorAll('.wms-wand-storage-location-input-select input').forEach((e,i)=>e.value=q.getAll('locationCodeSegmentList')[i]||'');
document.getElementById('find').onclick=()=>{const next=new URLSearchParams({tab:'goodsBatch',_t:String(Date.now()),current:'1'});for(const id of Object.values(fields)){const value=document.getElementById(id).value;if(value)next.set(id,value);}for(const e of document.querySelectorAll('.wms-wand-storage-location-input-select input'))next.append('locationCodeSegmentList',e.value);history.replaceState(null,'','#/co-wms/inventory-query-integration/list?'+next);header.style.display='none';setTimeout(()=>header.style.display='',800);setTimeout(()=>{document.querySelector('tbody').innerHTML=rows(filter(next));wireRows();},100);};wireRows();}
function wireRows(){document.querySelectorAll('a[data-sku]').forEach(a=>a.onclick=e=>{e.preventDefault();history.pushState(null,'','#/co-wms/non-erp/goods-flow/list?skuIdKeyword='+a.dataset.sku+'&repositoryId=12345&repositoryType=3');renderFlow();});}
function renderFlow(){const q=new URLSearchParams(location.hash.split('?')[1]||''),p=products.find(p=>p.sku===q.get('skuIdKeyword'));header.style.display='none';requestAnimationFrame(()=>{main.innerHTML='<div class="wms-wand-goods-info"><span class="wms-wand-goods-info-goods-name-text">'+p.name+'</span><span class="wms-wand-goods-info-rest-info-non-tooltip">SKU：'+p.sku+'</span></div>';setTimeout(()=>requestAnimationFrame(()=>header.style.display=''),1000);});}
addEventListener('popstate',()=>{if(location.hash.includes('/inventory-query-integration/'))renderInventory();});renderInventory();
</script></body></html>
