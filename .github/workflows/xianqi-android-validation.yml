name: Build Kuguan Android APK

on:
  push:
    branches: [main]
    paths:
      - apps/qnh-shelf-life/mobile-validation/**
      - apps/qnh-shelf-life/local-query/extract.mjs
      - apps/qnh-shelf-life/backend/qnh-browser-session.mjs
      - apps/qnh-shelf-life/backend/qnh-product-proof.mjs
      - apps/qnh-shelf-life/dist/core.mjs
      - apps/qnh-shelf-life/dist/photo-parser.mjs
      - apps/qnh-shelf-life/package-lock.json
      - .github/workflows/xianqi-android-validation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/qnh-shelf-life
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/qnh-shelf-life/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '12266719'
          packages: ''
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify phone query runtime
        run: |
          npm ci --ignore-scripts
          node --test mobile-validation/tests/*.test.mjs tests/photo-parser.test.mjs tests/core.test.mjs tests/mobile-cloud.test.mjs tests/backend.test.mjs tests/backend-phone-login.test.mjs
          node mobile-validation/build-runtime.mjs
      - name: Verify native URL boundaries
        run: |
          mkdir -p mobile-validation/build/url-policy
          javac -d mobile-validation/build/url-policy mobile-validation/app/src/main/java/com/xianqi/phonevalidation/QnhUrlPolicy.java mobile-validation/app/src/main/java/com/xianqi/phonevalidation/SkuPolicy.java mobile-validation/tests/UrlPolicyTest.java
          java -cp mobile-validation/build/url-policy com.xianqi.phonevalidation.UrlPolicyTest
      - name: Build and lint Android APK
        working-directory: apps/qnh-shelf-life/mobile-validation
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;34.0.0'
          gradle --no-daemon :app:testReleaseUnitTest :app:assembleRelease :app:lintRelease
          core_jar=$(find "$HOME/.gradle/caches/modules-2/files-2.1/com.google.zxing/core/3.5.3" -name 'core-3.5.3.jar' -print -quit)
          test -n "$core_jar"
          mkdir -p build/label-png-check
          javac -cp "$core_jar" -d build/label-png-check tests/LabelPngTest.java
          java -Djava.awt.headless=true -cp "$core_jar:build/label-png-check" com.xianqi.phonevalidation.LabelPngTest app/src/test/resources/label-example.png
          python -c "from zipfile import ZipFile; z=ZipFile('app/build/outputs/apk/release/app-release-unsigned.apk'); names=z.namelist(); assert 'assets/inventory.js' in names; assert 'assets/qnh-phone.js' not in names and 'assets/batch.js' not in names"
          mkdir -p output
          cp app/build/outputs/apk/release/app-release-unsigned.apk output/kuguan-0.7.0-unsigned.apk
          cp "$ANDROID_HOME/build-tools/34.0.0/lib/apksigner.jar" output/apksigner.jar
          cd output
          sha256sum *.apk *.jar > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: kuguan-android-0.7.0-unsigned
          path: |
            apps/qnh-shelf-life/mobile-validation/output/*.apk
            apps/qnh-shelf-life/mobile-validation/output/*.jar
            apps/qnh-shelf-life/mobile-validation/output/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  native-ui:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/qnh-shelf-life
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/qnh-shelf-life/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '12266719'
          packages: ''
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build native verification app
        run: |
          npm ci --ignore-scripts
          node mobile-validation/build-runtime.mjs
          sdkmanager 'platforms;android-35' 'build-tools;34.0.0' 'emulator' 'system-images;android-35;google_apis;x86_64'
          cd mobile-validation
          gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Verify native rendering and responsive screen
        working-directory: apps/qnh-shelf-life/mobile-validation
        run: |
          set -euo pipefail
          mkdir -p build output/native-qa
          sudo chmod a+rw /dev/kvm
          kuguan_avd_root="$RUNNER_TEMP/kuguan-avd"
          mkdir -p "$kuguan_avd_root"
          echo no | ANDROID_AVD_HOME="$kuguan_avd_root" avdmanager create avd --force --name kuguan-qa --path "$kuguan_avd_root/kuguan-qa.avd" --package 'system-images;android-35;google_apis;x86_64' --device pixel_6
          test -f "$kuguan_avd_root/kuguan-qa.avd/config.ini"
          printf 'avd.ini.encoding=UTF-8\npath=%s/kuguan-qa.avd\ntarget=android-35\n' "$kuguan_avd_root" > "$kuguan_avd_root/kuguan-qa.ini"
          ANDROID_AVD_HOME="$kuguan_avd_root" "$ANDROID_HOME/emulator/emulator" -list-avds
          ANDROID_AVD_HOME="$kuguan_avd_root" "$ANDROID_HOME/emulator/emulator" @kuguan-qa -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -memory 2048 > build/emulator.log 2>&1 &
          timeout 150 adb wait-for-device
          for attempt in $(seq 1 120); do
            if [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ]; then break; fi
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
          adb shell input keyevent 82
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb install -r app/build/outputs/apk/debug/app-debug.apk
          adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          adb shell pm grant com.xianqi.phonevalidation android.permission.CAMERA
          # No launcher is needed for explicitly launched instrumentation activities.
          # Disable only that emulator component; keep application error dialogs enabled.
          adb shell pm disable-user --user 0 com.google.android.apps.nexuslauncher
          mkdir -p output/native-qa
          timeout 180 adb shell am instrument -w com.xianqi.phonevalidation.test/com.xianqi.phonevalidation.LabelInstrumentation | tee output/native-qa/portrait.log
          python -c "from pathlib import Path; assert 'CHECKS PASSED' in Path('output/native-qa/portrait.log').read_text()"
          for file in label-native.png label-regression.png workspace-query.png workspace-label.png workspace-batch.png batch-001.png batch-002.png gallery-check.json; do
            adb exec-out run-as com.xianqi.phonevalidation cat "files/$file" > "output/native-qa/$file"
          done
          adb shell wm size 1920x1200
          adb shell wm density 240
          adb shell am force-stop com.google.android.apps.nexuslauncher
          timeout 180 adb shell am instrument -w -e wide true com.xianqi.phonevalidation.test/com.xianqi.phonevalidation.LabelInstrumentation | tee output/native-qa/wide.log
          python -c "from pathlib import Path; assert 'CHECKS PASSED' in Path('output/native-qa/wide.log').read_text()"
          adb exec-out run-as com.xianqi.phonevalidation cat files/workspace-wide.png > output/native-qa/workspace-wide.png
          core_jar=$(find "$HOME/.gradle/caches/modules-2/files-2.1/com.google.zxing/core/3.5.3" -name 'core-3.5.3.jar' -print -quit)
          mkdir -p build/native-png-check
          javac -cp "$core_jar" -d build/native-png-check tests/LabelPngTest.java
          java -Djava.awt.headless=true -cp "$core_jar:build/native-png-check" com.xianqi.phonevalidation.LabelPngTest output/native-qa/label-native.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kuguan-native-ui-0.7.0
          path: |
            apps/qnh-shelf-life/mobile-validation/output/native-qa/
            apps/qnh-shelf-life/mobile-validation/build/emulator.log
          if-no-files-found: warn
          retention-days: 14
